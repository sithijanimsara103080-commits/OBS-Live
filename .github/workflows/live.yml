name: Cloud OBS 24/7

on:
  workflow_dispatch:
    inputs:
      duration_min:
        description: 'Minutes to stream this run (keep under 350)'
        required: false
        default: '345'
      zoom_link:
        description: 'Zoom link (leave empty to use the ZOOM_LINK secret)'
        required: false
      bot_mode:
        description: 'app = Zoom desktop client (default), web = Zoom web client'
        required: false
        default: 'app'
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: cloud-obs-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - name: Skip when a stream is already running
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          active=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/live.yml/runs?status=in_progress&per_page=30" \
            --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID})] | length" 2>/dev/null || echo 0)
          echo "already_running=${active}" >> "$GITHUB_OUTPUT"

      - name: Queue the next run (instant hand-off when this one ends)
        if: steps.guard.outputs.already_running == '0' && vars.AUTO_RESTART == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT secret is not set - 24/7 chain disabled"
            exit 0
          fi
          gh workflow run live.yml --repo "$GITHUB_REPOSITORY" -f duration_min=345 \
            || echo "dispatch failed (check GH_PAT) - continuing with this run"
          echo "next run queued"

      - name: Install system dependencies
        if: steps.guard.outputs.already_running == '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg xvfb pulseaudio pulseaudio-utils \
            wget ca-certificates unzip fonts-liberation \
            libgbm1 libnss3 libxss1 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 \
            openbox xdotool x11-utils dbus-x11 \
            libxcb-xtest0 libxcb-shape0 libxcb-xfixes0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-image0 libxcb-render-util0 \
            libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libegl1 \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 \
            libasound2-plugins libxcb-randr0 libgl1 libsecret-1-0 \
            libxcb-xinput0 libdbus-1-3 libqt5core5a libqt5gui5 libqt5dbus5 \
            libqt5widgets5 libqt5network5 libqt5svg5 libqt5x11extras5 \
            libxcb-icccm4 libxcb-util1 libxcb-render0 libpulse-mainloop-glib0 \
            libxtst6 libxinerama1 libxi6 libsm6 libice6

      - name: Install Zoom desktop client
        if: steps.guard.outputs.already_running == '0' && (github.event.inputs.bot_mode || vars.BOT_MODE || 'app') != 'web'
        run: |
          set -e
          for u in https://zoom.us/client/latest/zoom_amd64.deb \
                   https://us05web.zoom.us/client/latest/zoom_amd64.deb; do
            if wget -q -O /tmp/zoom.deb "$u"; then break; fi
          done
          ls -l /tmp/zoom.deb
          sudo apt-get install -y /tmp/zoom.deb || sudo dpkg -i /tmp/zoom.deb || true
          sudo apt-get -f install -y || true
          ls -l /opt/zoom/zoom
          /opt/zoom/zoom --version || true

      - name: Install Google Chrome
        if: steps.guard.outputs.already_running == '0' && (github.event.inputs.bot_mode || vars.BOT_MODE || 'app') == 'web'
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb
          /usr/bin/google-chrome-stable --version

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.already_running == '0' && (github.event.inputs.bot_mode || vars.BOT_MODE || 'app') == 'web'
        with:
          node-version: '20'

      - name: Install node modules
        if: steps.guard.outputs.already_running == '0' && (github.event.inputs.bot_mode || vars.BOT_MODE || 'app') == 'web'
        run: npm install --no-audit --no-fund

      - name: Go live
        if: steps.guard.outputs.already_running == '0'
        env:
          YT_RTMP: ${{ secrets.YT_RTMP }}
          ZOOM_LINK: ${{ github.event.inputs.zoom_link || vars.ZOOM_LINK || secrets.ZOOM_LINK }}
          ZOOM_NAME: ${{ vars.ZOOM_NAME || 'Live' }}
          BRAND_TEXT: ${{ vars.BRAND_TEXT || 'Radapasa Astronomical Society' }}
          BOT_MODE: ${{ github.event.inputs.bot_mode || vars.BOT_MODE || 'app' }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DURATION_MIN: ${{ github.event.inputs.duration_min || '345' }}
          MAX_RUN_MIN: ${{ github.event.inputs.duration_min || '345' }}
        run: |
          chmod +x scripts/run.sh scripts/run-app.sh scripts/report.sh
          if [ "${BOT_MODE}" = "web" ]; then ./scripts/run.sh; else ./scripts/run-app.sh; fi

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obs-logs-${{ github.run_id }}
          path: |
            /tmp/shots
            /tmp/xvfb.log
            /tmp/pulse.log
          retention-days: 3
          if-no-files-found: ignore
